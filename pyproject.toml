[project]
name = "tg-assistant"
version = "0.1.0"
description = "Personal Telegram userbot: deletes messages and auto-replies on my behalf"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.45",
    "pydantic-settings>=2.6",
    "anthropic>=1.0",
    "httpx>=0.28.1",
    "aiohttp>=3.14.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]
