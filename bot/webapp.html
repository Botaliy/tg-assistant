<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пульт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #efeff4);
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #fff));
    --text: var(--tg-theme-text-color, #000);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --caption: var(--tg-theme-section-header-text-color, var(--hint));
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #fff);
    --link: var(--tg-theme-link-color, var(--accent));
    --danger: var(--tg-theme-destructive-text-color, #ff3b30);
    --line: var(--tg-theme-section-separator-color, color-mix(in srgb, var(--hint) 30%, transparent));
    --field: color-mix(in srgb, var(--hint) 13%, transparent);
    --bubble: color-mix(in srgb, var(--accent) 14%, var(--card));
    --safe-bottom: max(env(safe-area-inset-bottom), var(--tg-safe-area-inset-bottom, 0px));
    --tabbar: calc(56px + var(--safe-bottom));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: calc(var(--tabbar) + 24px); }
  body.pushed { padding-bottom: calc(var(--safe-bottom) + 24px); }
  button { font: inherit; color: inherit; cursor: pointer; }
  main { max-width: 640px; margin: 0 auto; }

  /* Header: a large title, like Telegram's own settings. */
  .head { display: flex; align-items: center; gap: 8px; padding: 14px 16px 2px; }
  .head h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -.02em; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .back { border: 0; background: none; color: var(--link); padding: 4px 0; font-size: 17px; }

  /* Grouped sections. */
  .caption { margin: 22px 16px 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .02em;
    color: var(--caption); }
  .footer { margin: 6px 16px 0; font-size: 13px; color: var(--hint); }
  .group { margin: 0 12px; background: var(--card); border-radius: 12px; overflow: hidden; }
  .first { margin-top: 14px; }
  .row { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px;
    padding: 9px 16px; border: 0; background: none; text-align: left; }
  button.row:active { background: var(--field); }
  .group > * + .row::before, .group > * + .field::before { content: ""; position: absolute; top: 0; right: 0;
    left: 16px; border-top: 1px solid var(--line); transform: scaleY(.5); transform-origin: top; }
  .group > .inset + .inset::before { left: 60px; }
  .body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .t { overflow-wrap: anywhere; }
  .s { font-size: 14px; color: var(--hint); overflow-wrap: anywhere; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .v { color: var(--hint); flex: none; font-variant-numeric: tabular-nums; }
  .chev { color: var(--hint); opacity: .6; font-size: 24px; line-height: 1; margin-right: -4px; }
  .row.link .t { color: var(--link); }
  .row.danger .t { color: var(--danger); }
  .ic { flex: none; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center;
    font-size: 17px; color: var(--link);
    background: color-mix(in srgb, var(--tint, var(--accent)) 18%, transparent); }
  .pill { flex: none; min-width: 22px; padding: 1px 7px; border-radius: 11px; text-align: center;
    font-size: 13px; font-weight: 600; background: var(--accent); color: var(--accent-text); }
  .tag { flex: none; font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--field);
    color: var(--hint); }

  /* Avatars in Telegram's colors. */
  .ava { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
    color: #fff; font-size: 14px; font-weight: 600; background: linear-gradient(var(--a1), var(--a2)); }
  .ava.big { width: 80px; height: 80px; font-size: 30px; }
  .profile { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 16px 0;
    text-align: center; }
  .profile .name { font-size: 22px; font-weight: 600; margin-top: 8px; overflow-wrap: anywhere; }

  /* Overview. */
  .hero { margin: 14px 12px 0; padding: 16px; background: var(--card); border-radius: 16px; }
  .hero .top { display: flex; align-items: center; gap: 12px; }
  .hero .ic { width: 44px; height: 44px; border-radius: 12px; font-size: 24px; }
  .hero .state { font-size: 19px; font-weight: 600; }
  .meter { margin-top: 14px; }
  .meter .labels { display: flex; justify-content: space-between; font-size: 14px; color: var(--hint); }
  .meter .bar { height: 6px; margin-top: 6px; border-radius: 3px; background: var(--field); overflow: hidden; }
  .meter .bar i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 12px 0; }
  .tile { background: var(--card); border-radius: 16px; padding: 14px 16px; }
  .tile .k { font-size: 14px; color: var(--hint); }
  .tile .n { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 2px 0;
    font-variant-numeric: tabular-nums; }

  /* Forms. */
  .field { position: relative; display: block; width: 100%; padding: 13px 16px; border: 0; outline: none;
    background: none; color: var(--text); font: inherit; }
  textarea.field { resize: none; min-height: 72px; }
  .tap { cursor: pointer; }
  .tap:active { opacity: .6; }
  .field::placeholder { color: var(--hint); opacity: .8; }
  .pad { padding: 12px 16px; }
  .btns { display: flex; flex-direction: column; gap: 8px; margin: 16px 12px 0; }
  .btns.inline { flex-direction: row; }
  .btns.inline > * { flex: 1; }
  .btn { height: 48px; border: 0; border-radius: 12px; font-weight: 600; padding: 0 14px;
    background: var(--accent); color: var(--accent-text); }
  .btn.soft { background: color-mix(in srgb, var(--accent) 13%, transparent); color: var(--link); }
  .btn.bad { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
  .btn.small { height: 32px; border-radius: 16px; font-size: 14px; padding: 0 12px; flex: none; }
  .btn:active { opacity: .7; }
  .seg { display: flex; padding: 2px; border-radius: 9px; background: var(--field); }
  .seg button { flex: 1; border: 0; background: none; padding: 7px 8px; border-radius: 7px; font-size: 15px;
    color: var(--text); transition: background .15s; }
  .seg button.on { background: var(--card); font-weight: 600; box-shadow: 0 1px 4px rgba(0, 0, 0, .12); }
  body.dark .seg button.on { background: color-mix(in srgb, var(--text) 20%, var(--card)); }
  .stepper { display: flex; align-items: center; gap: 2px; flex: none; }
  .stepper button { width: 32px; height: 32px; border: 0; border-radius: 50%; background: var(--field);
    color: var(--link); font-size: 20px; line-height: 1; }
  .stepper span { min-width: 30px; text-align: center; font-variant-numeric: tabular-nums; }
  .switch { position: relative; width: 51px; height: 31px; flex: none; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; border-radius: 16px; background: var(--field); transition: .2s; }
  .switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px;
    border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .25); transition: .2s; }
  .switch input:checked + span { background: #34c759; }
  .switch input:checked + span::after { transform: translateX(20px); }
  .switch input:disabled + span { opacity: .5; }

  /* Drafts: the answer as my own message bubble. */
  .draft { margin: 14px 12px 0; padding: 14px; background: var(--card); border-radius: 16px; }
  .who { display: flex; align-items: center; gap: 10px; }
  .bubble { margin: 12px 0 0 28px; padding: 8px 12px; border-radius: 18px 18px 6px 18px; background: var(--bubble); }
  .bubble textarea { display: block; width: 100%; border: 0; outline: none; background: none; resize: none;
    color: var(--text); font: inherit; padding: 0; }
  .draft .btns { margin: 12px 0 0; }

  /* Reports. */
  .report { margin: 12px 12px 0; padding: 14px 16px; background: var(--card); border-radius: 16px; }
  .report .text { margin-top: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }

  .empty { padding: 64px 32px; text-align: center; color: var(--hint); }
  .empty b { display: block; font-size: 48px; margin-bottom: 12px; font-weight: 400; }
  .spin { width: 28px; height: 28px; margin: 80px auto; border-radius: 50%; border: 3px solid var(--field);
    border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Tab bar. */
  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center;
    height: var(--tabbar); padding-bottom: var(--safe-bottom);
    background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px); }
  nav::before { content: ""; position: absolute; top: 0; left: 0; right: 0; border-top: 1px solid var(--line);
    transform: scaleY(.5); transform-origin: top; }
  nav button { position: relative; flex: 1; max-width: 128px; border: 0; background: none; color: var(--hint);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-size: 11px; font-weight: 500; }
  nav button.on { color: var(--accent); }
  nav svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round; }
  nav .pill { position: absolute; top: 4px; left: calc(50% + 6px); font-size: 11px; min-width: 18px;
    padding: 0 5px; line-height: 18px; background: var(--danger); color: #fff; }
  body.pushed nav { display: none; }

  #toast { position: fixed; left: 50%; bottom: calc(var(--tabbar) + 12px); transform: translate(-50%, 8px);
    width: max-content; max-width: calc(100% - 32px); padding: 11px 16px; border-radius: 14px;
    background: rgba(30, 30, 30, .92); color: #fff; font-size: 15px; white-space: pre-wrap; z-index: 10;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
  body.pushed #toast { bottom: calc(var(--safe-bottom) + 16px); }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.error { background: var(--danger); }
</style>
</head>
<body>
<main id="view"><div class="spin"></div></main>
<nav id="tabs"></nav>
<div id="toast"></div>
<script>
"use strict";
const tg = window.Telegram && Telegram.WebApp;
const ICONS = {
  home: "M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z",
  ai: "M21 11.5a8.5 8.5 0 0 1-12.3 7.6L3.5 20.5l1.4-4.6A8.5 8.5 0 1 1 21 11.5zM8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01",
  rules: "M3.5 5h17l-6.5 7.5V19l-4 2v-8.5z",
  drafts: "M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17zM14.5 7.5l2 2",
  reports: "M6.5 3h8L19 7.5V20a1 1 0 0 1-1 1H6.5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM14 3v5h5M9 13h6.5M9 17h4.5",
};
const TABS = [["home", "Обзор"], ["ai", "Чаты"], ["rules", "Правила"], ["drafts", "Черновики"], ["reports", "Отчёты"]];
const AVATAR_COLORS = [["#ff885e", "#ff516a"], ["#ffcd6a", "#ffa85c"], ["#82b1ff", "#665fff"], ["#a0de7e", "#54cb68"],
  ["#53edd6", "#28c9b7"], ["#72d5fd", "#2a9ef1"], ["#e0a2f3", "#d669ed"]];
let tab = "home";
let state = null;
// Screens opened over a tab (a chat, a form); Telegram's back button closes them.
let stack = [];
let draftContext = 10;

// DOM without innerHTML: everything from the server goes in as text.
function h(tag, props, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k in el && k !== "list") el[k] = v;
    else el.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c !== null && c !== undefined && c !== false)
    el.append(c instanceof Node ? c : String(c));
  return el;
}
function svg(path) {
  const ns = "http://www.w3.org/2000/svg";
  const el = document.createElementNS(ns, "svg");
  el.setAttribute("viewBox", "0 0 24 24");
  const p = document.createElementNS(ns, "path");
  p.setAttribute("d", path);
  el.append(p);
  return el;
}

// Building blocks.
const nativeBack = () => !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast("6.1"));
const head = (title) => h("div", {class: "head"},
  stack.length && !nativeBack() ? h("button", {class: "back", onclick: pop}, "‹ Назад") : null,
  h("h1", {}, title));
const section = (caption, rows, footer) => [
  caption ? h("div", {class: "caption"}, caption) : null,
  h("div", {class: "group" + (caption ? "" : " first")}, rows),
  footer ? h("div", {class: "footer"}, footer) : null,
];
function row({icon, tint, avatar, title, sub, value, right, chevron, onclick, cls = "", clamp}) {
  return h(onclick ? "button" : "div", {class: `row ${cls} ${icon || avatar ? "inset" : ""}`, onclick},
    icon ? h("span", {class: "ic", style: tint ? `--tint:${tint}` : ""}, icon) : null,
    avatar || null,
    h("span", {class: "body"}, h("span", {class: "t"}, title),
      sub ? h("span", {class: "s" + (clamp ? " clamp" : "")}, sub) : null),
    value !== undefined && value !== null ? h("span", {class: "v"}, value) : null,
    right || null,
    chevron ? h("span", {class: "chev"}, "›") : null);
}
const btn = (text, onclick, cls = "") => h("button", {class: "btn " + cls, onclick}, text);
function seg(options, current, pick) {
  return h("div", {class: "seg"}, options.map(([value, text]) =>
    h("button", {class: value === current ? "on" : "", onclick: () => value !== current && pick(value)}, text)));
}
const empty = (emoji, text) => h("div", {class: "empty"}, h("b", {}, emoji), text);

function avatar(label, id, big = false) {
  const [a1, a2] = AVATAR_COLORS[Math.abs(Number(id) || 0) % AVATAR_COLORS.length];
  const words = (label || "").replace(/^[@+]/, "").split(/[\s_.]+/).filter(Boolean);
  const initials = words.length ? (words[0][0] + (words[1] ? words[1][0] : "")).toUpperCase() : "#";
  return h("span", {class: "ava" + (big ? " big" : ""), style: `--a1:${a1};--a2:${a2}`}, initials);
}
const nameOf = (label, id) => label || `#${id}`;
function money(x) {
  x = x || 0;
  if (!x) return "$0";
  return "$" + x.toFixed(x >= 1 ? 2 : x >= 0.01 ? 3 : 4);
}
const tokens = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "K" : String(n || 0);
const showModel = (c) => state.deepseek_available || c.model === "deepseek";

let toastTimer;
function toast(text, error = false) {
  const el = document.getElementById("toast");
  el.textContent = text;
  el.className = "show" + (error ? " error" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = "", 2800);
  tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(error ? "error" : "success");
}
const tick = () => tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged();

async function api(path, body) {
  const response = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: {"Authorization": "tma " + tg.initData, "Content-Type": "application/json"},
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await response.json().catch(() => ({error: `HTTP ${response.status}`}));
  if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
  return data;
}

async function load() {
  state = await api("api/state");
  render();
}

// Runs a panel command; the answer goes to a toast, then everything reloads.
// True when it worked, so a form can close itself.
async function run(name, arg = "", where = {}) {
  let ok = false;
  try {
    const answer = await api("api/command", {name, arg, ...where});
    toast(answer.text, answer.error);
    ok = !answer.error;
  } catch (e) {
    toast(e.message, true);
  }
  await load().catch(() => {});
  return ok;
}

function confirmThen(text, action) {
  if (tg && tg.showConfirm) tg.showConfirm(text, (yes) => yes && action());
  else if (confirm(text)) action();
}

// Navigation.
function push(screen) {
  stack.push(screen);
  render();
  scrollTo(0, 0);
}
function pop() {
  stack.pop();
  render();
}
function goTab(key) {
  if (key !== tab) tick();
  tab = key;
  stack = [];
  render();
  scrollTo(0, 0);
}

function renderTabs() {
  const nav = document.getElementById("tabs");
  nav.replaceChildren(...TABS.map(([key, title]) => {
    const count = key === "drafts" && state ? state.drafts.length : 0;
    return h("button", {class: key === tab ? "on" : "", onclick: () => goTab(key)},
      svg(ICONS[key]), title, count ? h("span", {class: "pill"}, count) : null);
  }));
}

function render() {
  const screen = stack[stack.length - 1];
  const content = (screen || {home, ai, rules, drafts, reports}[tab])();
  // A screen may close itself (its chat is gone): look again.
  if (screen && stack[stack.length - 1] !== screen) return render();
  document.body.classList.toggle("pushed", !!screen);
  if (nativeBack()) screen ? tg.BackButton.show() : tg.BackButton.hide();
  renderTabs();
  document.getElementById("view").replaceChildren(...[content].flat(3).filter(Boolean));
}

// --- Обзор ---

function home() {
  const s = state;
  const toggle = h("input", {type: "checkbox", checked: s.ai_enabled, disabled: !s.ai_available,
    onchange: (e) => run("ai", e.target.checked ? "on" : "off")});
  const status = !s.ai_available ? "Нет ключа API" : s.ai_enabled ? "ИИ отвечает" : "ИИ на паузе";
  const share = s.daily_limit ? Math.min(100, Math.round(100 * s.replies_today / s.daily_limit)) : 0;
  const requests = (part) => part.models.reduce((sum, m) => sum + m.requests, 0);
  const {today, month, top} = s.usage;
  const listed = (id) => s.chats.some((c) => c.id === id);
  return [
    head("Обзор"),
    h("div", {class: "hero"},
      h("div", {class: "top"},
        h("span", {class: "ic"}, "🤖"),
        h("div", {class: "body"}, h("div", {class: "state"}, status),
          h("div", {class: "s"}, s.chats.length ? `чатов в списке: ${s.chats.length}` : "список чатов пуст")),
        h("label", {class: "switch"}, toggle, h("span"))),
      s.daily_limit ? h("div", {class: "meter"},
        h("div", {class: "labels"}, h("span", {}, "Ответов сегодня"), h("span", {}, `${s.replies_today} из ${s.daily_limit}`)),
        h("div", {class: "bar"}, h("i", {style: `width:${share}%`}))) : null),
    h("div", {class: "tiles"},
      h("div", {class: "tile"}, h("div", {class: "k"}, "Сегодня"), h("div", {class: "n"}, money(today.total)),
        h("div", {class: "s"}, `запросов: ${requests(today)}`)),
      h("div", {class: "tile"}, h("div", {class: "k"}, "За месяц"), h("div", {class: "n"}, money(month.total)),
        h("div", {class: "s"}, `запросов: ${requests(month)}`))),
    s.drafts.length ? section("", [row({icon: "📝", tint: "#ff9500", title: "Черновики ждут решения",
      right: h("span", {class: "pill"}, s.drafts.length), chevron: true, onclick: () => goTab("drafts")})]) : null,
    section("Характер", [row({icon: "🎭", tint: "#af52de", title: s.persona ? "Общий характер" : "Не задан",
      sub: s.persona || "как ИИ пишет от моего имени во всех чатах", clamp: true, chevron: true,
      onclick: () => push(personaScreen)})]),
    month.models.length ? section("Модели за месяц", month.models.map((m) => row({
      icon: m.model.startsWith("deepseek") ? "🐉" : "✳️", tint: m.model.startsWith("deepseek") ? "#5856d6" : "#d97757",
      title: m.model, sub: `${m.requests} запр. · ${tokens(m.input)} → ${tokens(m.output)} ток.`, value: money(m.cost),
    }))) : null,
    top.length ? section("Дороже всех", top.map((c) => row({
      avatar: avatar(c.label, c.id), title: nameOf(c.label, c.id), sub: `${c.requests} запр.`, value: money(c.cost),
      chevron: listed(c.id), onclick: listed(c.id) ? () => push(chatScreen(c.id)) : undefined,
    }))) : null,
    section("Сервис", [row({icon: "💾", tint: "#34c759", title: "Бэкап сейчас", cls: "link",
      sub: "правила и база придут в бота файлами", onclick: () => run("backup")})]),
  ];
}

function personaScreen() {
  const text = h("textarea", {class: "field", value: state.persona, rows: 5,
    placeholder: "Например: пишу коротко, на «ты», шучу"});
  return [
    head("Характер"),
    section("", [text], "Как ИИ пишет от моего имени во всех чатах. У отдельного чата можно задать свой."),
    h("div", {class: "btns"},
      btn("Сохранить", async () => await run("persona", text.value.trim() || "-") && pop()),
      state.persona ? btn("Сбросить", async () => await run("persona", "-") && pop(), "bad") : null),
  ];
}

// --- Чаты ---

function ai() {
  const chats = state.chats.map((c) => row({
    avatar: avatar(c.label, c.id), title: nameOf(c.label, c.id), chevron: true,
    sub: [c.paused_until ? `⏸ ты в чате до ${pausedTill(c)}` : c.drafts ? "📝 черновики" : "отвечает сам", showModel(c) ? (c.model === "deepseek" ? "DeepSeek" : "Claude") : null,
      c.persona ? "свой характер" : null].filter(Boolean).join(" · "),
    right: c.auto ? h("span", {class: "tag"}, "незнакомец") : null,
    onclick: () => push(chatScreen(c.id)),
  }));
  return [
    head("Чаты с ИИ"),
    section("", [row({icon: "＋", title: "Добавить чат", cls: "link", onclick: () => push(addChatScreen)}), ...chats],
      (chats.length ? "" : "Список пуст. ") + "Незнакомцы, написавшие первыми, попадают сюда сами."),
  ];
}

function pausedTill(c) {
  return new Date(c.paused_until * 1000).toLocaleTimeString("ru-RU", {hour: "2-digit", minute: "2-digit"});
}

function chatScreen(id) {
  return function () {
    const c = state.chats.find((x) => x.id === id);
    if (!c) {
      stack.pop();
      return [];
    }
    const where = {chat_id: c.id};
    const persona = h("textarea", {class: "field", value: c.persona, rows: 3, placeholder: "Например: язвительно, односложно"});
    const counter = h("span", {}, draftContext);
    const draftHint = h("span", {class: "s"});
    const step = (d) => {
      draftContext = Math.max(5, Math.min(50, draftContext + d));
      counter.textContent = draftContext;
      draftHint.textContent = `прочитает ${draftContext} последних сообщ.`;
      tick();
    };
    step(0);
    return [
      head(""),
      h("div", {class: "profile"}, avatar(c.label, c.id, true), h("div", {class: "name"}, nameOf(c.label, c.id)),
        h("div", {class: "s"}, [`#${c.id}`, `ответов всего: ${c.replies}`, c.auto ? "незнакомец" : null].filter(Boolean).join(" · "))),
      h("div", {class: "caption"}, "Режим"),
      h("div", {class: "group pad"}, seg([["", "Отвечает сам"], ["draft", "Черновики"]], c.drafts ? "draft" : "",
        (v) => run("ai", v, where))),
      h("div", {class: "footer"}, c.paused_until
        ? `Ты пишешь здесь сам: ИИ молчит до ${pausedTill(c)}, пока ты не замолчишь на ${state.takeover_minutes} мин.`
        : c.drafts ? "ИИ готовит черновик, отправляю я." : "ИИ отвечает сам, в пределах лимитов."),
      showModel(c) ? [h("div", {class: "caption"}, "Модель"),
        h("div", {class: "group pad"}, seg([["claude", "Claude"], ["deepseek", "DeepSeek 🐉"]], c.model,
          (v) => run("model", v, where)))] : null,
      section("Характер с ним", [persona,
        h("div", {class: "pad btns inline", style: "margin:0"},
          btn("Сохранить", () => run("persona", persona.value.trim() || "-", where), "soft small"),
          c.persona ? btn("Сбросить", () => run("persona", "-", where), "bad small") : null)],
        "Пусто — общий характер."),
      section("Сейчас", [
        c.paused_until ? row({icon: "▶️", tint: "#34c759", title: "Вернуть ИИ сейчас", cls: "link",
          sub: `сейчас молчит до ${pausedTill(c)}`, onclick: () => run("ai", c.drafts ? "draft" : "", where)}) : null,
        row({icon: "✍️", tint: "#007aff", title: "Ответить сам", sub: "ИИ ответит в чат сразу", cls: "link",
          onclick: () => run("ans", "", where)}),
        // Not a button as a whole: the stepper's buttons live inside it.
        h("div", {class: "row link inset"},
          h("span", {class: "ic", style: "--tint:#ff9500"}, "📝"),
          h("span", {class: "body tap", onclick: () => run("draft", String(draftContext), where)},
            h("span", {class: "t"}, "Написать черновик"), draftHint),
          h("span", {class: "stepper"},
            h("button", {onclick: () => step(-5)}, "−"), counter, h("button", {onclick: () => step(5)}, "+"))),
        row({icon: "♻️", tint: "#34c759", title: "Сбросить лимит на сегодня", cls: "link",
          onclick: () => run("reset", "", where)}),
      ]),
      h("div", {class: "btns"}, btn("Убрать из списка ИИ", () => confirmThen(
        `Убрать ${nameOf(c.label, c.id)} из списка ИИ? Незнакомца он больше не подхватит.`,
        () => run("noai", "", where)), "bad")),
    ];
  };
}

function addChatScreen() {
  const target = h("input", {class: "field", placeholder: "@username или +телефон", autocapitalize: "off"});
  let mode = "";
  const modes = h("div", {class: "group pad"});
  const setMode = (v) => {
    mode = v;
    modes.replaceChildren(seg([["", "Отвечает сам"], ["draft", "Черновики"]], mode, setMode));
  };
  setMode("");
  return [
    head("Новый чат"),
    section("Кто", [target]),
    h("div", {class: "caption"}, "Режим"), modes,
    h("div", {class: "btns"}, btn("Добавить", async () => {
      if (!target.value.trim()) return toast("Кого добавить?", true);
      if (await run("ai", mode, {target: target.value.trim()})) pop();
    })),
  ];
}

// --- Правила ---

function rules() {
  const s = state;
  const ruleRows = s.rules.map((r) => row({
    icon: r.kind === "reply" ? "💬" : "🚫", tint: r.kind === "reply" ? "#007aff" : "#ff3b30",
    title: r.keywords.join(", "), clamp: true,
    sub: `${r.kind === "reply" ? "→ " + r.text : "удалять"} · ${r.chat_id === null ? "все лички" : nameOf(r.chat_label, r.chat_id)}`,
    right: btn("Удалить", () => confirmThen(`Удалить правило «${r.keywords.join(", ")}»?`, () => run("unrule", String(r.id))), "bad small"),
  }));
  const mutedRows = s.muted.map((m) => row({
    avatar: avatar(m.label, m.id), title: nameOf(m.label, m.id),
    right: btn("Вернуть", () => run("unmute", "", {chat_id: m.id}), "soft small"),
  }));
  return [
    head("Правила"),
    section("", [row({icon: "＋", title: "Новое правило", cls: "link", onclick: () => push(ruleScreen)}), ...ruleRows],
      "Автоответ отвечает на ключевые слова, фильтр удаляет такие сообщения."),
    section("Заглушённые", [row({icon: "🔇", tint: "#8e8e93", title: "Заглушить", cls: "link", onclick: () => push(muteScreen)}),
      ...mutedRows], "Все их новые сообщения удаляются у обоих."),
  ];
}

function ruleScreen() {
  let kind = "reply";
  const target = h("input", {class: "field", placeholder: "@username, +телефон или пусто — все лички", autocapitalize: "off"});
  const keywords = h("input", {class: "field", placeholder: "цена, прайс"});
  const text = h("textarea", {class: "field", rows: 3, placeholder: "Цены в закрепе"});
  const textPart = h("div", {}, section("Что отвечать", [text]));
  const kinds = h("div", {class: "group pad first"});
  const setKind = (v) => {
    kind = v;
    textPart.style.display = kind === "reply" ? "" : "none";
    kinds.replaceChildren(seg([["reply", "💬 Автоответ"], ["filter", "🚫 Фильтр"]], kind, setKind));
  };
  setKind("reply");
  const add = async () => {
    const keys = keywords.value.trim();
    if (!keys) return toast("Нужно хотя бы одно слово", true);
    const where = target.value.trim() ? {target: target.value.trim()} : {};
    let ok;
    if (kind === "reply") {
      if (!text.value.trim()) return toast("Нужен текст ответа", true);
      ok = await run("reply", `${keys} => ${text.value.trim()}`, where);
    } else ok = await run("filter", keys, where);
    if (ok) pop();
  };
  return [
    head("Новое правило"), kinds,
    section("Для кого", [target]),
    section("Ключевые слова", [keywords], "Через запятую. Сработает, если в сообщении есть любое."),
    textPart,
    h("div", {class: "btns"}, btn("Добавить", add)),
  ];
}

function muteScreen() {
  const target = h("input", {class: "field", placeholder: "@username или +телефон", autocapitalize: "off"});
  return [
    head("Заглушить"),
    section("Кого", [target], "Все его новые сообщения будут удаляться у обоих."),
    h("div", {class: "btns"}, btn("Заглушить", async () => {
      if (!target.value.trim()) return toast("Кого заглушить?", true);
      if (await run("mute", "", {target: target.value.trim()})) pop();
    }, "bad")),
  ];
}

// --- Черновики ---

function drafts() {
  if (!state.drafts.length) return [head("Черновики"),
    empty("📝", "Черновиков нет. Напиши .draft в переписке или открой чат на вкладке «Чаты».")];
  return [head("Черновики"), ...state.drafts.map((d) => {
    const text = h("textarea", {value: d.text, rows: 1});
    const fit = () => { text.style.height = "auto"; text.style.height = text.scrollHeight + "px"; };
    text.addEventListener("input", fit);
    requestAnimationFrame(fit);
    const act = async (action, body) => {
      try {
        const answer = await api(`api/drafts/${d.id}/${action}`, body || {});
        toast(answer.text, answer.error);
      } catch (e) { toast(e.message, true); }
      if (action === "redo") setTimeout(() => load().catch(() => {}), 6000);
      await load().catch(() => {});
    };
    return h("div", {class: "draft"},
      h("div", {class: "who"}, avatar(d.label, d.chat_id),
        h("div", {class: "body"}, h("div", {class: "t"}, nameOf(d.label, d.chat_id)),
          h("div", {class: "s"}, `прочитал ${d.context} сообщ. · текст можно поправить`))),
      h("div", {class: "bubble"}, text),
      h("div", {class: "btns"},
        btn("Отправить", () => act("send", text.value.trim() !== d.text ? {text: text.value} : {})),
        h("div", {class: "btns inline", style: "margin:0"},
          btn("🔄 Другой", () => act("redo"), "soft"),
          btn("Отбросить", () => act("drop"), "bad"))));
  })];
}

// --- Отчёты ---

function reports() {
  if (!state.reports.length) return [head("Отчёты"),
    empty("🗒", "Отчётов пока нет. Они появляются, когда разговор с ИИ затихает.")];
  const when = (ts) => new Date(ts * 1000).toLocaleString("ru", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"});
  return [head("Отчёты"), ...state.reports.map((r) => h("div", {class: "report"},
    h("div", {class: "who"}, avatar(r.label, r.chat_id),
      h("div", {class: "body"}, h("div", {class: "t"}, nameOf(r.label, r.chat_id)), h("div", {class: "s"}, when(r.ts))),
      r.reason ? h("span", {class: "tag"}, r.reason) : null),
    h("div", {class: "text"}, r.text)))];
}

// Fresh data every 15 s, but never under my fingers or over an open screen.
setInterval(() => {
  const busy = document.activeElement && ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName);
  if (!document.hidden && !busy && !stack.length && state) load().catch(() => {});
}, 15000);

if (!tg || !tg.initData) {
  document.getElementById("view").replaceChildren(empty("🖥", "Открой пульт из Telegram: кнопка «Пульт» в боте."));
} else {
  tg.ready();
  document.body.classList.toggle("dark", tg.colorScheme === "dark");
  tg.onEvent && tg.onEvent("themeChanged", () => document.body.classList.toggle("dark", tg.colorScheme === "dark"));
  tg.expand();
  if (nativeBack()) {
    tg.setHeaderColor("secondary_bg_color");
    tg.setBackgroundColor("secondary_bg_color");
    tg.BackButton.onClick(pop);
  }
  if (tg.isVersionAtLeast && tg.isVersionAtLeast("7.7")) tg.disableVerticalSwipes();
  load().catch((e) => document.getElementById("view").replaceChildren(empty("⚠️", e.message)));
}
</script>
</body>
</html>
